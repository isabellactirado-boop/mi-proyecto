<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRE-ICMA - Iniciar Sesión</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .logo-img { max-width: 140px; height: auto; margin-bottom: 15px; border-radius: 8px; }
        .login-card h2 { color: #1e3c72; margin-bottom: 8px; font-size: 26px; }
        .login-card p { color: #666; margin-bottom: 25px; font-size: 14px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; transition: 0.3s; }
        .form-group input:focus { border-color: #2a5298; outline: none; box-shadow: 0 0 5px rgba(42, 82, 152, 0.3); }
        .btn-login { width: 100%; background: #2a5298; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #1e3c72; }
        .forgot-pass { display: block; margin-top: 15px; color: #2a5298; font-size: 13px; text-decoration: none; }
        .forgot-pass:hover { text-decoration: underline; }
        .footer-text { margin-top: 25px; font-size: 13px; color: #777; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="logo.jpeg" alt="Logo PRE-ICMA" class="logo-img">
        <h2>Plataforma PRE-ICMA</h2>
        <p>Ingresa tus credenciales para acceder</p>
        <form>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" placeholder="estudiante@correo.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="button" class="btn-login" onclick="alert('Iniciando sesión en PRE-ICMA...')">Iniciar Sesión</button>
            <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
        </form>
        <div class="footer-text">
            ¿No tienes cuenta? <a href="#" style="color:#2a5298; font-weight:bold;">Regístrate aquí</a>
        </div>
    </div>
</body>
</html>
