<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRE-ICMA - Panel de profesores</title>
<!-- Solo entra quien ya inició sesión; los administradores van a su panel -->
<script>
  (function () {
    var rol = sessionStorage.getItem('rol');
    if (sessionStorage.getItem('isLoggedIn') !== 'true' || !sessionStorage.getItem('token')) {
      window.location.replace('index.html');
    } else if (rol === 'administrador' || rol === 'propietario') {
      window.location.replace('dashboard-admin.html');
    }
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#1b2f6b; --cream:#f6f1e7; --yellow:#ffd23f; --orange:#ff7a3d; --ink:#1a1f36; --muted:#666b80; }
  *{ box-sizing:border-box; margin:0; padding:0 }
  body{ font-family:'DM Sans',sans-serif; color:var(--ink); background:var(--cream); min-height:100vh; display:grid; place-items:center; padding:24px }
  .card{ width:100%; max-width:480px; background:#fffdf8; border:3px solid var(--ink); border-radius:24px; padding:36px 30px; box-shadow:10px 10px 0 var(--yellow); text-align:center }
  .brand{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; color:var(--navy); letter-spacing:.02em; margin-bottom:18px }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:1.7rem; letter-spacing:-.02em }
  p{ color:var(--muted); margin:10px 0 }
  strong#nombre{ color:var(--ink) }
  button{ margin-top:22px; font:inherit; font-weight:700; color:#fff; background:var(--navy); border:2px solid var(--ink); border-radius:12px; padding:12px 22px; cursor:pointer; box-shadow:4px 4px 0 var(--ink) }
  button:hover{ background:var(--orange) }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">PRE-ICMA</div>
    <h1>Panel de profesores</h1>
    <p>Hola, <strong id="nombre">profesor</strong>.</p>
    <p>Este panel está en construcción. Pronto podrás tomar asistencia y consultar los puntajes de los estudiantes.</p>
    <button type="button" id="salir">Cerrar sesión</button>
  </main>
  <script>
    var usuario = sessionStorage.getItem('currentUser');
    if (usuario) document.getElementById('nombre').textContent = usuario;
    document.getElementById('salir').addEventListener('click', function () {
      sessionStorage.clear();
      window.location.replace('index.html');
    });
  </script>
</body>
</html>
