<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRE-ICMA - Panel de profesores</title>
<!-- Solo entra quien ya inició sesión; los administradores van a su panel -->
<script>
  (function () {
    var rol = sessionStorage.getItem('rol');
    if (sessionStorage.getItem('isLoggedIn') !== 'true' || !sessionStorage.getItem('token')) {
      window.location.replace('index.html');
    } else if (rol === 'administrador' || rol === 'propietario') {
      window.location.replace('dashboard-admin.html');
    }
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard-admin.css">
</head>
<body>

<aside class="side">
  <div class="me">
    <div class="av" id="av">P</div>
    <div><strong id="uname">Profesor</strong><small>Panel docente</small></div>
  </div>
  <ul class="nav">
    <li><a href="#" class="on">Mis clases</a></li>
  </ul>
  <div class="moonbox">
    <div class="disk"><i></i><i></i><i></i></div>
    <a class="logout" href="#" id="salir">Cerrar sesión</a>
  </div>
</aside>

<main>
  <header class="hero">
    <div class="hero-txt">
      <h1>Hola, <em id="display-user">profesor</em></h1>
      <p id="today"></p>
    </div>
  </header>

  <div class="grid">
    <div class="panel c12" style="--c:var(--yellow)">
      <h2><span>Mis clases</span><small class="ac-rango">Última semana y próximas 3</small></h2>
      <div class="tscroll">
        <table>
          <thead><tr><th>Fecha</th><th>Curso · Grupo</th><th>Tema</th><th>Asistencia</th><th></th></tr></thead>
          <tbody id="clases-tabla"><tr><td colspan="5" class="ac-vacio">Cargando…</td></tr></tbody>
        </table>
      </div>
      <small class="note">Toca "Asistencia" para marcar a cada estudiante como presente, tarde, ausente o con excusa. Puedes corregirla después.</small>
    </div>
  </div>
</main>

<script>
  var usuario = sessionStorage.getItem('currentUser') || 'profesor';
  document.getElementById('uname').textContent = usuario;
  document.getElementById('display-user').textContent = usuario.split('@')[0];
  document.getElementById('av').textContent = usuario.charAt(0).toUpperCase();
  var hoy = new Date().toLocaleDateString('es-CO', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('today').textContent = hoy.charAt(0).toUpperCase() + hoy.slice(1);
  document.getElementById('salir').addEventListener('click', function (e) {
    e.preventDefault();
    sessionStorage.clear();
    window.location.replace('index.html');
  });
</script>
<script src="academico.js"></script>
</body>
</html>
