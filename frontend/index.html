<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRE-ICMA - Iniciar Sesión</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .logo-img { max-width: 120px; height: auto; margin-bottom: 12px; border-radius: 8px; }
        .login-card h2 { color: #1e3c72; margin-bottom: 6px; font-size: 24px; }
        .login-card p { color: #666; margin-bottom: 20px; font-size: 14px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; font-size: 13px; }
        .form-group input, .form-group select { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; transition: 0.3s; background: white; }
        .form-group input:focus, .form-group select:focus { border-color: #2a5298; outline: none; box-shadow: 0 0 5px rgba(42, 82, 152, 0.3); }
        .btn-login { width: 100%; background: #2a5298; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn-login:hover { background: #1e3c72; }
        .forgot-pass { display: block; margin-top: 15px; color: #2a5298; font-size: 13px; text-decoration: none; }
        .forgot-pass:hover { text-decoration: underline; }
        .footer-text { margin-top: 20px; font-size: 13px; color: #777; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="logo.jpeg" alt="Logo PRE-ICMA" class="logo-img">
        <h2>Plataforma PRE-ICMA</h2>
        <p>Ingresa tus credenciales para acceder</p>
        <form onsubmit="iniciarSesion(event)">
            <div class="form-group">
                <label>Tipo de Usuario</label>
                <select id="userRole" required>
                    <option value="estudiante">🎓 Estudiante</option>
                    <option value="docente">👨‍🏫 Maestro / Docente</option>
                    <option value="admin">🏛️ Directivo / Administrador</option>
                </select>
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" placeholder="usuario@correo.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
            <a href="#" onclick="alert('Se ha enviado un enlace de recuperación a tu correo.')" class="forgot-pass">¿Olvidaste tu contraseña?</a>
        </form>
        <div class="footer-text">
            ¿No tienes cuenta? <a href="#" onclick="alert('Módulo de registro en construcción.')" style="color:#2a5298; font-weight:bold;">Regístrate aquí</a>
        </div>
    </div>

    <script>
        function iniciarSesion(event) {
            event.preventDefault();
            const role = document.getElementById('userRole').value;
            // Redirige al módulo interactivo y le pasa el rol seleccionado en la URL
            window.location.href = "modulos.html?rol=" + role;
        }
    </script>
</body>
</html>
